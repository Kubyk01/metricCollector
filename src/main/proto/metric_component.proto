syntax = "proto3";

package io.github.kubyk01.metrichub;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "metric.proto";

option java_multiple_files = true;
option java_package = "io.github.kubyk01.metrichub";
option java_outer_classname = "MetricComponentProto";

service MetricComponentService {
  rpc AddMetricComponents(AddMetricComponentsRequest) returns (google.protobuf.Empty);

  rpc AddComponentValues(AddBatchComponentsRequest) returns (google.protobuf.Empty);
}

message AddMetricComponentsRequest {
  string metric_id = 1;
  repeated MetricComponentDTO components = 2;
}

message AddBatchComponentsRequest {
  repeated AddComponentValuesRequest entries = 1;
}

message AddComponentValuesRequest {
  string metric_id = 1;
  repeated ComponentStubDTO component_stub = 2;
}

message ComponentStubDTO {
  string component_name = 1;
  google.protobuf.Timestamp timestamp = 2;
  optional string value = 3;
}

